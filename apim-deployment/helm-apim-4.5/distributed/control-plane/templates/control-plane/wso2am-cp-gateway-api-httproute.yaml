{{- if and .Values.kubernetes.gatewayAPI.enabled .Values.kubernetes.gatewayAPI.controlPlane.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "apim-helm-cp.fullname" . }}-httproute
  namespace: {{ .Release.Namespace }}
{{- if .Values.kubernetes.gatewayAPI.controlPlane.annotations }}
  annotations:
{{ toYaml .Values.kubernetes.gatewayAPI.controlPlane.annotations | indent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ .Values.kubernetes.gatewayAPI.gatewayName }}
    {{- if .Values.kubernetes.gatewayAPI.gatewayNamespace }}
    namespace: {{ .Values.kubernetes.gatewayAPI.gatewayNamespace }}
    {{- end }}
    sectionName: {{ .Values.kubernetes.gatewayAPI.controlPlane.sectionName | default "control-plane-https" }}
  hostnames:
  {{- if .Values.kubernetes.gatewayAPI.controlPlane.hostnames }}
  {{- toYaml .Values.kubernetes.gatewayAPI.controlPlane.hostnames | nindent 2 }}
  {{- else }}
  - {{ .Values.kubernetes.gatewayAPI.controlPlane.hostname }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ template "apim-helm-cp.fullname" . }}-service
      port: {{ add 9763 (.Values.wso2.apim.portOffset | default 0) }}
    {{- if .Values.kubernetes.gatewayAPI.controlPlane.filters }}
    filters:
{{ toYaml .Values.kubernetes.gatewayAPI.controlPlane.filters | indent 4 }}
    {{- end }}
{{- end }}
