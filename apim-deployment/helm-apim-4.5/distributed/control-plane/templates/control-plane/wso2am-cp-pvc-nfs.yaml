{{- if and .Values.nfs .Values.nfs.enabled (not .Values.nfs.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ template "apim-helm-cp.fullname" . }}-shared-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apim-helm-cp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.nfs.storageClass | default "nfs-csi" | quote }}
  resources:
    requests:
      storage: {{ .Values.nfs.capacity | default "10Gi" }}
{{- end }}
