apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-mi
  namespace: wso2-dist
  labels:
    app.kubernetes.io/name: mi
    helm.sh/chart: mi-4.4.0-0
    app.kubernetes.io/instance: mi
    app.kubernetes.io/version: "4.4.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    checkov.io/skip1: CKV_K8S_22=suppress read-only file system check
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      deployment: cloud-mi
  template:
    metadata:
      annotations:
        checksum.mi.toml: 523dfb7cb5eb66a216890e5c427903e3b08d48efe042581cabc36bfd7ce5fb41
        checksum.mi.log4j2.properties: 0f57d4bea07fe96eda5cc78b80460d37daaa98a0d46affde21cd805e53330424
        checksum.mi.secret.properties: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        checksum.mi.entrypoint.sh: c1b3935fb67b5df14622faf6389d522d47cc37bbcfb44c2f9179702a8e222b1b
      labels:
        deployment: cloud-mi
    spec:
      securityContext:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: deployment
                      operator: In
                      values:
                        - cloud-mi
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: wso2mi
          image: "wezer/wso2mi-openshift@sha256:ef1cd8978881bbc8df82a71b7bac1a715ff0cea46d1e389df1743ab14b6894f3"
          imagePullPolicy: IfNotPresent
          args:
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z localhost 8253
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /liveness
              port: 9201
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9201
            initialDelaySeconds: 6
            periodSeconds: 1
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1000m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8253
              protocol: TCP
            - containerPort: 9201
              protocol: TCP
            - containerPort: 9164
              protocol: TCP
          env:
            - name: JAVA_MEM_OPTS
              value: "-Xms512m -Xmx1024m"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: JAVA_OPTS
              value: "-Djavax.net.ssl.trustStore=/home/wso2carbon/wso2mi-4.4.0/repository/resources/security/client-truststore.jks -Djavax.net.ssl.trustStorePassword=wso2carbon -Dhttps.protocols=TLSv1.2 -Dtrust.all.certs=true -Djdk.internal.httpclient.disableHostnameVerification=true"
          volumeMounts:
            - name: wso2mi-toml
              mountPath: /home/wso2carbon/wso2-config-volume/conf/deployment.toml
              subPath: deployment.toml
            - name: wso2mi-log4j2-properties
              mountPath: /home/wso2carbon/wso2-config-volume/conf/log4j2.properties
              subPath: log4j2.properties
            - name: capps
              mountPath: /home/wso2carbon/wso2mi-4.4.0/repository/deployment/server/carbonapps
              # Primary keystore
            - name: keystores
              mountPath: /home/wso2carbon/wso2mi-4.4.0/repository/resources/security/wso2carbon.jks
              subPath: wso2carbon.jks
              # Internal keystore - only mount if different from primary keystore
            - name: wso2mi-entrypoint
              mountPath: /home/wso2carbon/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
      volumes:
        - name: wso2mi-toml
          configMap:
            name: cloud-mi-mi-toml
        - name: wso2mi-log4j2-properties
          configMap:
            name: cloud-mi-mi-log4j2-properties
        - name: keystores
          secret:
            secretName: mi-keystores
        - name: capps
          persistentVolumeClaim:
            claimName: mi-carbonapps-pvc
        - name: wso2mi-entrypoint
          configMap:
            name: cloud-mi-mi-entrypoint
            defaultMode: 493
