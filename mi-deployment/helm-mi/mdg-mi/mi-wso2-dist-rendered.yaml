apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-mi
  namespace : wso2-dist
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - "wso2mi-sybylcloud.internal-lab.com"
      secretName: wso2-shared-wildcard-tls
  rules:
    - host: "wso2mi-sybylcloud.internal-lab.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-mi
                port:
                  number: 8253
          - path: /management
            pathType: Prefix
            backend:
              service:
                name: cloud-mi
                port:
                  number: 9164
