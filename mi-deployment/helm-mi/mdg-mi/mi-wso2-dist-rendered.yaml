apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-mi-mi-toml
  namespace : wso2-dist
data:
  deployment.toml: "[server]\nhostname = \"wso2mi-sybylcloud.internal-lab.com\"\noffset  = 10\n\n[transport.https.properties]\nproxyPort = 443\n\n[internal_apis.file_user_store]\nenable = true\n\n[super_admin]\nusername = \"admin\"\ncreate_admin_account = true\npassword = \"admin\"\n\n[keystore.primary]\nfile_name = \"repository/resources/security/wso2carbon.jks\"\nalias = \"wso2carbon\"\npassword = \"wso2carbon\"\nkey_password = \"wso2carbon\"\n\n[keystore.internal]\nfile_name = \"repository/resources/security/wso2carbon.jks\"\nalias = \"wso2carbon\"\npassword = \"wso2carbon\"\nkey_password = \"wso2carbon\"\n\n[truststore]\nfile_name = \"repository/resources/security/client-truststore.jks\"\npassword = \"wso2carbon\"\nalias = \"symmetric.key.value\"\nalgorithm = \"AES\"\n\n\n\n\n[dashboard_config]\ndashboard_url = \"https://cloud-icp.wso2-dev.svc.cluster.local:9743/dashboard/api/\"\nheartbeat_interval = 5\ngroup_id = \"default\"\nnode_id = \"cloud-mi-node-1\"\nmanagement_hostname = \"cloud-mi\"\nmanagement_port = 9164\n\n\n[[service_catalog]]\napim_host = \"https://apim-wso2am-all-in-one-am-service.wso2-dev.svc.cluster.local:9763\"\nenable = true\nusername = \"admin\"\npassword = \"admin\"\n\n\n[synapse_properties]\n'org.wso2.ignoreHostnameVerification' = true\n\n\n\n\n\n\n[transport.passthrough]\ndisable_ssl_verification = true"
