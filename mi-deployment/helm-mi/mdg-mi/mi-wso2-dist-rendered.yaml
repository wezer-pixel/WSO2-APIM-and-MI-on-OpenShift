apiVersion: v1
kind: Service
metadata:
  name: cloud-mi
  namespace: wso2-dist
  labels:
    app.kubernetes.io/name: mi
    helm.sh/chart: mi-4.4.0-0
    app.kubernetes.io/instance: mi
    app.kubernetes.io/version: "4.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    deployment: cloud-mi
  ports:
    - port: 8290
      targetPort: 8290
      protocol: TCP
      name: pass-through-http
    - port: 8253
      targetPort: 8253
      protocol: TCP
      name: pass-through-https
    - port: 9201
      targetPort: 9201
      protocol: TCP
      name: metrics
    - port: 9164
      targetPort: 9164
      protocol: TCP
      name: management
