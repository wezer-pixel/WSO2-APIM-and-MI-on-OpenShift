# ---------------------------------------------------------------------------------
# WSO2 Micro Integrator 4.4.0 — Sybyl Internal Lab Production Values
# Namespace  : wso2-mi
# Image      : docker.wso2.com/wso2mi:4.4.0  (official WSO2 image)
# Ingress    : Gateway API (Envoy Gateway) — same Envoy as APIM, listener *.sybyl.int
# Storage    : NFS (nfs-csi StorageClass) — Nimble-backed NFS provisioner
# TLS        : *.sybyl.int wildcard from Sybyl Internal CA (secret: wso2-mi-wildcard-tls)
# ---------------------------------------------------------------------------------

# -- Cloud provider. Leave empty for on-prem/bare-metal.
provider: ""

# -- Container registry. Empty = use image.repository as-is.
containerRegistry: ""

wso2:
  # -- WSO2 subscription credentials (leave empty; using official public image).
  subscription:
    username: ""
    password: ""

  # -- Nginx Ingress disabled. We use Gateway API HTTPRoute instead (see mi-gateway-httproute.yaml).
  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    tlsSecret: ""
    ratelimit:
      enabled: false
      zoneName: ""
      burstLimit: ""

  config:
    # -- Port offset 10 → effective ports: HTTP 8290, HTTPS 8253, mgmt 9164, metrics 9201
    portOffset: 10

    admin:
      username: "admin"
      password: "admin"
      createAdminAccount: true

    userstore:
      file:
        enabled: true

    secureVault:
      enabled: false

    keyStore:
      primary:
        fileName: "wso2carbon.jks"
        alias: "wso2carbon"
        password: "wso2carbon"
        keyPassword: "wso2carbon"
      internal:
        fileName: "wso2carbon.jks"
        alias: "wso2carbon"
        password: "wso2carbon"
        keyPassword: "wso2carbon"

    trustStore:
      primary:
        fileName: "client-truststore.jks"
        password: "wso2carbon"

    # -- Service Catalog integration with APIM Control Plane
    serviceCatalog:
      enabled: true
      # CP internal service — port 9763 (offset 10 on default 9753 → 9763)
      apimHost: "https://wso2am-cp-service.wso2-apim.svc.cluster.local:9763"
      username: "admin"
      password: "admin"

    synapseProperties:
      'org.wso2.ignoreHostnameVerification': "true"

    # -- ICP (Integration Control Plane) — disabled for now, enable when ICP is deployed
    icp:
      url: ""
      groupId: ""
      nodeId: ""
      managementHostname: ""
      managementPort: 0
      heartbeatInterval: 10

  deployment:
    securityContext:
      apparmor: false
      seccompProfile:
        enabled: false
        type: RuntimeDefault
      enableRunAsUser: false
      enableRunAsGroup: false
      seLinux:
        enabled: false
        level: ""

    # -- Hostname exposed via Gateway API HTTPRoute
    hostname: "mi.sybyl.int"

    BuildVersion: "4.4.0"

    # -- K8s Secret that holds wso2carbon.jks and client-truststore.jks
    JKSSecretName: "mi-keystores"

    # -- Mount carbonapps from NFS PVC
    mountCapps: true
    cappsPvcName: "mi-carbonapps-pvc"

    # -- Mount shared libs (JDBC connectors, custom mediators) from NFS PVC.
    # Drop .jar files onto the NFS share; all MI replicas pick them up automatically.
    mountLibs: true
    libsPvcName: "mi-libs-pvc"

    imagePullSecrets: ""

    image:
      # -- Public DockerHub image — no subscription required.
      # Build and push a custom image only if you need extra OS packages.
      # JDBC connectors and integration libs go on the NFS libs volume instead.
      repository: "wso2/wso2mi"
      digest: ""
      tag: "4.4.0"
      pullPolicy: "IfNotPresent"

    probes:
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 40
      liveness:
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 5

    # -- 2 replicas spread across wkr1 and wkr2 for HA
    replicas: 2

    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 4
      cpuUtilizationPercentage: 75
      memoryUtilizationPercentage: 75

    pdb:
      enabled: true
      minAvailable: 1

    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0

    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"
      jvm:
        memory:
          xms: "512m"
          xmx: "1024m"

    envs:
      JAVA_OPTS: >-
        -Djavax.net.ssl.trustStore=/home/wso2carbon/wso2mi-4.4.0/repository/resources/security/client-truststore.jks
        -Djavax.net.ssl.trustStorePassword=wso2carbon
        -Dhttps.protocols=TLSv1.2
        -Dtrust.all.certs=true
        -Djdk.internal.httpclient.disableHostnameVerification=true

    synapseTest:
      enabled: false

    configMaps:
      entryPoint:
        defaultMode: 0755