{{- if .Values.wso2.deployment.mountCapps }}
{{- if not .Values.wso2.deployment.cappsPvcName }}
# Auto-generated PVC for carbonapps — only rendered when cappsPvcName is NOT pre-set.
# If you pre-create the PVC externally (recommended for NFS), set cappsPvcName in values.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ template "resource.prefix" . }}-{{ .Release.Name }}-carbonapps
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "micro-integrator.labels" . | indent 4 }}
spec:
  accessModes:
    - ReadWriteMany      # NFS supports RWX — allows multiple MI pods to share the volume
  resources:
    requests:
      storage: {{ template "capp-storage-capacity" . }}
  storageClassName: {{ template "capp-storage-class-name" . }}
{{- end }}
{{- end }}
